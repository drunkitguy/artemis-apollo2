name: Build APK

# Publishes installable APKs.
#
# Run it from the Actions tab and leave "release_tag" blank to get the APKs as
# a workflow artifact, or fill it in to publish a GitHub release. Pushing a v*
# tag publishes a release for that tag.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a release under this tag (blank = artifact only)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the source and its submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the pinned NDK
        run: sdkmanager --install "ndk;27.0.12077973"

      - name: Build the debug APKs
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleNonRoot_gameDebug --no-daemon --stacktrace

      - name: Upload the APKs as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: artemis-nonRoot-debug-apks
          path: app/build/outputs/apk/nonRoot_game/debug/*.apk
          if-no-files-found: error

      # Creates the tag as well when it does not already exist, which is why a
      # release can be published straight from a manual run.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: app/build/outputs/apk/nonRoot_game/debug/*.apk
          generate_release_notes: true
