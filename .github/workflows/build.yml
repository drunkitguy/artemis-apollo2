name: Build APK

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a GitHub Release with the APKs"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  # Queue rather than cancel, so every push still produces a downloadable APK.
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # moonlight-common-c is a submodule and the native core does not build
          # without it.
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform and NDK
        # The NDK version is pinned in app/build.gradle; ndk-build compiles the
        # native core, so an absent or mismatched NDK fails the whole build.
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Run soft keyboard unit tests
        # Scoped to the pure JVM suites rather than the whole test source set:
        # the rest of it is Robolectric and pulls in a device-shaped world that
        # has nothing to do with these, and a flake there must not stop an APK.
        run: |
          ./gradlew --no-daemon testNonRoot_gameDebugUnitTest \
            --tests 'com.limelight.binding.input.softkeyboard.*' \
            --tests 'com.limelight.reconnect.*' \
            --tests 'com.limelight.bitratetest.*' \
            --tests 'com.limelight.sweep.*' \
            --tests 'com.limelight.binding.input.trackpad.*' \
            --tests 'com.limelight.preferences.NativeResolutionTest' \
            --tests 'com.limelight.preferences.StreamDisplayChooserTest'

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleNonRoot_gameDebug

      - name: Collect APKs
        id: collect
        run: |
          mkdir -p dist
          VERSION="$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -1)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          find app/build/outputs/apk -name "*.apk" -print
          # Publish only the 64-bit ARM build. That is what every current Android
          # handheld runs; armeabi-v7a is 32-bit and the x86 splits are for
          # emulators, so shipping all four only makes the right one harder to find.
          APK="$(find app/build/outputs/apk -name "*arm64-v8a*.apk" | head -1)"
          if [ -z "$APK" ]; then
            echo "No arm64-v8a APK produced" >&2
            exit 1
          fi
          cp "$APK" "dist/artemis-${VERSION}-b${GITHUB_RUN_NUMBER}-arm64.apk"
          ls -lh dist

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artemis-apks
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: |
          github.event_name != 'pull_request' &&
          (github.event_name != 'workflow_dispatch' || inputs.publish_release) &&
          github.ref == 'refs/heads/claude/voidlink-android-streaming-5l52vu'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.collect.outputs.version }}-b${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/*.apk \
            --title "Artemis ${{ steps.collect.outputs.version }} (build ${GITHUB_RUN_NUMBER})" \
            --notes "Automated build from \`${GITHUB_REF_NAME}\` @ \`${GITHUB_SHA}\`.

          Debug build of Artemis, signed with the standard Android debug key. It installs
          alongside a release Artemis install rather than replacing it." \
            --target "${GITHUB_SHA}"
