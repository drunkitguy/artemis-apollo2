name: Build APK

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a GitHub Release with the APKs"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  # Queue rather than cancel: every push should produce a downloadable APK, so a
  # rapid follow-up push must not kill the build that was about to publish one.
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Assemble APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate signing keystore
        # Throwaway key so the release APK is installable. Regenerated per run, so
        # upgrading over a previously installed release build requires an uninstall.
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/voidlink.jks" \
            -alias voidlink \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass voidlink -keypass voidlink \
            -dname "CN=VoidLink Android, OU=CI, O=VoidLink, L=, S=, C=US"

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Assemble release APK
        env:
          VOIDLINK_KEYSTORE: ${{ runner.temp }}/voidlink.jks
          VOIDLINK_KEYSTORE_PASSWORD: voidlink
          VOIDLINK_KEY_ALIAS: voidlink
          VOIDLINK_KEY_PASSWORD: voidlink
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect APKs
        id: collect
        run: |
          mkdir -p dist
          VERSION="$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/debug/app-debug.apk \
             "dist/voidlink-${VERSION}-b${GITHUB_RUN_NUMBER}-debug.apk"
          REL=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -n "$REL" ]; then
            cp "$REL" "dist/voidlink-${VERSION}-b${GITHUB_RUN_NUMBER}-release.apk"
          fi
          ls -lh dist

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voidlink-apks
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        # Only the working branch publishes, so feature branches do not spam the
        # release list with a tag per push.
        #
        # Best-effort: the APKs are already built, signed and uploaded as artifacts
        # by this point, so a permissions failure on the Releases API must not fail
        # a build that produced the actual deliverable. It warns instead.
        continue-on-error: true
        if: |
          github.event_name != 'pull_request' &&
          (github.event_name != 'workflow_dispatch' || inputs.publish_release) &&
          github.ref == 'refs/heads/claude/voidlink-android-streaming-5l52vu'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.collect.outputs.version }}-b${GITHUB_RUN_NUMBER}"
          NOTES="Automated build from \`${GITHUB_REF_NAME}\` @ \`${GITHUB_SHA}\`.

          **Debug** APK is signed with the standard Android debug key. **Release** APK is signed with a throwaway key generated during this run, so installing a newer release build over an older one requires uninstalling first.

          This is an independent, from-scratch reimplementation inspired by VoidLink. It is not affiliated with, endorsed by, or derived from the VoidLink or Moonlight projects."

          for attempt in 1 2 3; do
            if gh release create "$TAG" dist/*.apk \
                 --title "VoidLink Android ${{ steps.collect.outputs.version }} (build ${GITHUB_RUN_NUMBER})" \
                 --notes "$NOTES" \
                 --target "${GITHUB_SHA}"; then
              echo "Published release $TAG" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Release attempt $attempt failed; retrying." >&2
            sleep $((attempt * 5))
          done

          {
            echo "### Release publishing failed"
            echo ""
            echo "The APKs built and signed successfully and are attached to this run as the"
            echo "\`voidlink-apks\` artifact. Only the Releases API call failed, which usually"
            echo "means the workflow token lacks release-creation permission on this repository."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
